name: master_academy
description: "Master Academy Flutter App with Clean Architecture, MVVM, Lifecycle & Payment Gateway."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  get_it: ^7.7.0
  cupertino_icons: ^1.0.6
  local_auth: ^2.1.8
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  permission_handler: ^11.3.1
  intl: ^0.20.2
  video_player: ^2.9.2
  share_plus: ^12.0.2
  url_launcher: ^6.3.1
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/
